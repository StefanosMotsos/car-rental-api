services:
  postgres:
    image: postgres:17
    container_name: carrentalapi-db
    environment:
      POSTGRES_USER: "CRStef"
      POSTGRES_PASSWORD: "Cod1ngFa"
      POSTGRES_DB: "CarRentalDB"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-CRStef} -d ${DB_NAME:-CarRentalDB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  

  webapp:
    build: .
    container_name: carrentalapi-app
    ports:
      - "${APP_PORT:-8081}:8080"
    environment:
      Jwt__Issuer: "${JWT_ISSUER:-https://localhost:8081}"
      Jwt__Audience: "${JWT_AUDIENCE:-https://localhost:8081}"
      Jwt__Secret: "${JWT_SECRET}"
      Cors__Origin: "${CORS_ORIGIN:-http://localhost:3000}"
      AllowedHosts: "${ALLOWED_HOSTS:-*}"
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ConnectionStrings__DevConnection: "Host=${DB_HOST};Database=${DB_NAME};Username=${DB_USER};Password=${DB_USER_PASSWORD}"
    depends_on:   
      postgres:
        condition: service_healthy

volumes:
  postgres-data: